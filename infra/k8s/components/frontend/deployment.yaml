apiVersion: apps/v1
kind: Deployment
metadata:
  name: railsuite-frontend
  namespace: railsuite
spec:
  replicas: 1
  selector:
    matchLabels:
      app: railsuite-frontend
  template:
    metadata:
      labels:
        app: railsuite-frontend
    spec:
      containers:
        - name: railsuite-frontend
          image: railsuite-frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80