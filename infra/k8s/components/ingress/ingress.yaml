apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: railsuite-ingress
  namespace: railsuite
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: railsuite.local
      http:
        paths:

          - path: /
            pathType: Prefix
            backend:
              service:
                name: railsuite-frontend
                port:
                  number: 80

          - path: /api
            pathType: Prefix
            backend:
              service:
                name: railsuite-core
                port:
                  number: 8080